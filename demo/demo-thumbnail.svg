<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Demo video placeholder — zkAge Proof">
  <!-- background -->
  <rect width="1280" height="720" fill="#0b1020"/>
  <rect x="24" y="24" width="1232" height="672" rx="28" fill="#131a30" stroke="#253055" stroke-width="3"/>

  <!-- subtle terminal-style top bar -->
  <rect x="52" y="56" width="120" height="14" rx="7" fill="#253055"/>
  <rect x="184" y="56" width="60" height="14" rx="7" fill="#253055"/>
  <rect x="256" y="56" width="84" height="14" rx="7" fill="#253055"/>
  <circle cx="1204" cy="63" r="9" fill="#3ddc97"/>

  <!-- headline -->
  <text x="640" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="700" fill="#e8ecf8">zkAge Proof — Demo</text>
  <text x="640" y="308" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="30" fill="#93a0c4">wallet connect &#8594; in-browser ZK proof &#8594; on-chain result</text>

