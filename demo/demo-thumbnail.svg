    <text x="746" y="410" text-anchor="middle" fill="#93a0c4">&#8594;</text>

    <rect x="778" y="372" width="220" height="56" rx="14" fill="#0d1329" stroke="#3ddc97" stroke-width="2"/>
    <text x="888" y="408" text-anchor="middle" fill="#3ddc97">Verified 18+</text>
