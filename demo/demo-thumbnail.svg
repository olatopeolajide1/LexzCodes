    <rect x="250" y="372" width="200" height="56" rx="14" fill="#0d1329" stroke="#6c8cff" stroke-width="2"/>
    <text x="350" y="408" text-anchor="middle" fill="#6c8cff">Connect</text>

    <text x="482" y="410" text-anchor="middle" fill="#93a0c4">&#8594;</text>

    <rect x="514" y="372" width="200" height="56" rx="14" fill="#0d1329" stroke="#6c8cff" stroke-width="2"/>
