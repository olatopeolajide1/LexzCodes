  <text x="640" y="656" text-anchor="middle" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#93a0c4">Video placeholder &#8212; the recorded demo link will be embedded here</text>
